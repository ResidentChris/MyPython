# Default settings for `my`. Copy this file to settings.toml (which git
# ignores) and change the values for your machine.
#
# Strings can use these placeholders:
#   {root}        the `root` setting below
#   {repository}  the directory `my` is run from

# Folder containing your repositories. Logs are written to {root}/logs.
root = "/path/to/repositories"

[git.repos]
FrontEnd = "{repository}/FrontEnd"

[harness]
folder = "{root}/example-sdk/react/library"
url = "https://localhost.example.com:8080"

[npm]
wsl_user = "your_wsl_user"

[npm.environment]
APP_ONE_URL = "http://localhost:9999"
APP_TWO_URL = "http://localhost:9999"

[qmk]
folder = "/path/to/qmk_firmware"
keyboard = "keebio/iris/rev5"
keymap = "ColemakForMac"

[xc]
folder = "{root}/example-sdk"
workspace = "ios/library/test-harness/ExampleSdk.xcworkspace"
scheme = "ExampleSdk-Unit-Tests"
