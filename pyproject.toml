[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mypython"
version = "0.1.0"
description = "Personal command-line helpers for git, gradle, npm, qmk and xcodebuild"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "colorama",
    "gitpython",
    "prompt_toolkit",
    "questionary",
]

[tool.setuptools]
py-modules = [
    "my",
    "my_colours",
    "my_git",
    "my_gradle",
    "my_harness",
    "my_npm",
    "my_qmk",
    "my_xc",
]
